name: Client pack

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build client pack
        env:
          VERSION: ${{ github.event.release.tag_name || github.sha }}
        run: python3 scripts/build-client-pack.py --version "$VERSION" --output-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: cumcraft-mrpacks
          path: dist/*.mrpack
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cumcraft-mrpacks
      - name: Attach packs to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" ./*.mrpack --clobber

  release-site:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/website.yml
