name: Client pack

on:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build client pack
        env:
          VERSION: ${{ github.event.release.tag_name || github.sha }}
        run: python3 scripts/build-client-pack.py --version "$VERSION" --output cumcraft.mrpack
      - uses: actions/upload-artifact@v4
        with:
          name: cumcraft-mrpack
          path: cumcraft.mrpack
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cumcraft-mrpack
      - name: Attach pack to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" cumcraft.mrpack --clobber
