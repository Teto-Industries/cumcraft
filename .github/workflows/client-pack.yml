name: Client pack

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build client pack
        env:
          VERSION: ${{ github.event.release.tag_name || github.sha }}
        run: python3 scripts/build-client-pack.py --version "$VERSION" --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: cumcraft-mrpacks
          path: dist/*.mrpack
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cumcraft-mrpacks
      - name: Attach packs to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" ./*.mrpack --clobber

  site:
    needs: [build, publish]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}
      - uses: oven-sh/setup-bun@v2
      - name: Build site
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CUMCRAFT_RELEASES_FILE: ${{ runner.temp }}/releases.json
        run: |
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" --jq 'add // []' > "$CUMCRAFT_RELEASES_FILE"
          bun install --frozen-lockfile
          bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy-pages:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency: cumcraft-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
