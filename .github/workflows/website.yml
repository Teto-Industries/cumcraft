name: Website

on:
  pull_request:
    paths:
      - 'site/**'
      - 'client/pack.json'
      - 'server-icon.png'
      - '.github/workflows/website.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'client/pack.json'
      - 'server-icon.png'
      - '.github/workflows/website.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}
      - uses: oven-sh/setup-bun@v2
      - name: Build site
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CUMCRAFT_RELEASES_FILE: ${{ runner.temp }}/releases.json
        run: |
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" | jq -e 'add // []' > "$CUMCRAFT_RELEASES_FILE"
          bun install --frozen-lockfile
          bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy-pages:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency: cumcraft-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
